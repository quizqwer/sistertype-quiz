:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);
  --glass: rgba(255,255,255,0.6);

  --display: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
    --glass: var(--surface);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
  --glass: var(--surface);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 28px;
  padding-bottom: 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
  gap:20px;
}

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

/* ---------- start ---------- */
#start{
  margin:auto 0; text-align:center;
  position:relative; overflow:hidden;
  padding:40px 28px 32px;
  border-radius:28px;
  color:var(--ink);
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:0 30px 70px -36px rgba(33,31,28,0.18);
}
#start > *{ position:relative; z-index:1; }
#start .eyebrow{ color:var(--accent); }
#start h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(30px, 7.4vw, 42px);
  line-height:1.3; margin:12px 0 14px;
  text-wrap:balance; color:var(--ink);
}
#start p.lede{
  font-size:16.5px; line-height:1.7; color:var(--ink-soft);
  margin:0 auto 26px; max-width:44ch;
}
.type-chips{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  margin-bottom:26px;
}
.type-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:14.5px; font-weight:600;
  background:var(--accent-soft); border:1px solid var(--line);
  color:var(--ink);
  border-radius:999px; padding:8px 16px 8px 12px;
}
.type-chip svg{ width:15px; height:15px; color:var(--accent); flex:none; }
.btn-primary{
  font-family:var(--body); font-weight:700; font-size:18.5px;
  border:none; border-radius:16px;
  padding:16px 36px; cursor:pointer;
}
#start .btn-primary, #quiz .btn-primary, #result .btn-primary{ color:#fff; background:var(--ink); }
:root[data-theme="dark"] #start .btn-primary,
:root[data-theme="dark"] #quiz .btn-primary,
:root[data-theme="dark"] #result .btn-primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #start .btn-primary,
  :root:not([data-theme="light"]) #quiz .btn-primary,
  :root:not([data-theme="light"]) #result .btn-primary{ color:var(--bg); }
}
.btn-primary:active{ transform:scale(0.98); }
#start .meta{
  margin-top:14px; font-size:14px; color:var(--ink-soft);
}

/* ---------- quiz ---------- */
#quiz{
  flex:1; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  padding:22px 24px 26px;
  border-radius:28px;
  color:var(--ink);
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:0 26px 60px -32px rgba(33,31,28,0.16);
}
#quiz > *{ position:relative; z-index:1; }
.rail{
  display:flex; align-items:center; gap:14px;
  margin-bottom:22px;
}
.back-btn{
  flex:none; width:38px; height:38px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface-2);

    opts:{ sis:"對方很有主見、講話很篤定", lil:"對方笑起來很可愛，讓妳很想照顧她",
           peer:"聊得很對頻，像認識很久的朋友" } },
  { axis:"attract", tag:"妳容易被什麼吸引", q:"妳比較容易喜歡上：",
    opts:{ sis:"看起來很可靠、什麼都處理得來的人", lil:"看起來需要人保護、會跟妳撒嬌的人",
           peer:"跟妳實力相當、可以互相討論的人" } },
  { axis:"attract", tag:"妳容易被什麼吸引", q:"理想中對方主動聯絡妳的方式是：",
    opts:{ sis:"直接約時間地點，乾脆俐落", lil:"傳訊息說想妳了、問妳在幹嘛",
           peer:"自然地聊近況，順便約下次見面" } },
  { axis:"attract", tag:"妳容易被什麼吸引", q:"吵架後對方先低頭，妳希望看到的畫面是：",
    opts:{ sis:"對方抱著妳說「是我不好」", lil:"對方傳一大段訊息解釋，很在乎妳的感受",
           peer:"對方直接約出來，把話講開" } },
  { axis:"attract", tag:"妳容易被什麼吸引", q:"對「被照顧」這件事，妳的想法是：",
    opts:{ sis:"偶爾被照顧很好，但大部分時候我更想主導", lil:"很喜歡，被照顧會讓我很有安全感",
           peer:"可以被照顧，但更希望是互相的" } },
  { axis:"attract", tag:"妳容易被什麼吸引", q:"最吸引妳的對話方式是：",
    opts:{ sis:"對方講話有想法、能說服我", lil:"對方講話軟軟的，很會撒嬌",
           peer:"對方講話很平等，像在聊天不是在哄" } },
  { axis:"attract", tag:"妳容易被什麼吸引", q:"如果要形容妳喜歡的人設，妳會選：",
    opts:{ sis:"可以讓我依靠的「大人感」", lil:"讓我想疼的「小朋友感」",
           peer:"讓我覺得自在平等的「夥伴感」" } }
];

/* ---------------- state ---------------- */
var current = 0;
var answers = []; // { axis, key } per question, index-aligned with QUESTIONS
var shuffledOrders = []; // remembers shuffle per question for back-navigation

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ---------------- render: start ---------------- */
var chipsEl = document.getElementById("type-chips");
ORDER.forEach(function(key){
  var t = TYPES[key];
  chipsEl.insertAdjacentHTML("beforeend",
    '<span class="type-chip">'+iconSvg(key,15)+t.name+'</span>');
});

document.getElementById("start-btn").addEventListener("click", function(){
  logEvent("start");
  document.getElementById("start").hidden = true;
  document.getElementById("quiz").hidden = false;
  renderQuestion();
});

/* ---------------- render: quiz ---------------- */
var railFill = document.getElementById("rail-fill");
var railCount = document.getElementById("rail-count");
var sectionTag = document.getElementById("section-tag");
var qTitle = document.getElementById("q-title");
var qOptions = document.getElementById("q-options");
var backBtn = document.getElementById("back-btn");

backBtn.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

function renderQuestion(){
  var total = QUESTIONS.length;
  railFill.style.width = (current/total*100)+"%";
  railCount.textContent = (current+1)+" / "+total;
  backBtn.style.visibility = current===0 ? "hidden" : "visible";

  var item = QUESTIONS[current];
  sectionTag.textContent = item.tag;
  qTitle.textContent = item.q;
  qOptions.innerHTML = "";

  var order = shuffledOrders[current];
  if(!order){
    order = shuffle(ORDER);
    shuffledOrders[current] = order;
  }

  order.forEach(function(key){
    var btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = item.opts[key];
    btn.addEventListener("click", function(){
      answers[current] = { axis: item.axis, key: key };
      if(current < QUESTIONS.length - 1){
        current++;
        renderQuestion();
      } else {
        showResult();
      }
    });
    qOptions.appendChild(btn);
  });
}

/* ---------------- result ----------------
   Two independent tallies: how you voted on the 7 self-axis questions
   decides your own temperament, how you voted on the 7 attract-axis
   questions decides what draws you in. Ties are broken by a fixed
   priority order (sis > lil > peer) — simple and transparent. */
function showResult(){
  var selfCounts = {}, attractCounts = {};
  ORDER.forEach(function(k){ selfCounts[k]=0; attractCounts[k]=0; });
  answers.forEach(function(a){
    if(!a) return;
    if(a.axis==="self") selfCounts[a.key]++;
    else attractCounts[a.key]++;
  });
  function winner(counts){
    var best = ORDER[0], bestCount = -1;
    ORDER.forEach(function(key){
      if(counts[key] > bestCount){ bestCount = counts[key]; best = key; }
    });
    return best;
  }
  var selfKey = winner(selfCounts);
  var attractKey = winner(attractCounts);
  var selfT = TYPES[selfKey];
  var attractT = TYPES[attractKey];
  var scenarios = SCENARIOS[selfKey+"-"+attractKey];

  document.getElementById("hero-icon").innerHTML = iconSvg(selfKey, 34);
  document.getElementById("r-name").textContent = selfT.name+"氣質";
  document.getElementById("r-tagline").textContent = "容易被"+attractT.name+"吸引";

  var attractTotal = ORDER.reduce(function(sum,k){ return sum+attractCounts[k]; }, 0) || 1;
  var rowsEl = document.getElementById("attract-rows");
  rowsEl.innerHTML = "";
  ORDER.forEach(function(key){
    var t = TYPES[key];
    var pct = Math.round(attractCounts[key]/attractTotal*100);
    var row = document.createElement("div");
    row.className = "attract-row";
    row.innerHTML =
      '<div class="ar-icon">'+iconSvg(key,14)+'</div>'+
      '<div class="ar-main">'+
        '<div class="ar-top"><span class="ar-name">'+t.name+'</span><span class="ar-pct">'+pct+'%</span></div>'+
        '<div class="attract-track"><div class="attract-fill" style="width:'+pct+'%"></div></div>'+
      '</div>';
    rowsEl.appendChild(row);
  });

  var descEl = document.getElementById("r-desc");
  descEl.innerHTML = "";
  var rows = [
    { label:"妳的氣質", text: selfT.selfDesc },
    { label:"妳容易被什麼吸引", text: attractT.attractDesc }
  ].concat(scenarios);
  rows.forEach(function(row){
    var div = document.createElement("div");
    div.className = "stage-row";
    var label = document.createElement("div");
    label.className = "stage-label";
    label.textContent = row.label;
    var text = document.createElement("p");
    text.className = "stage-text";
    text.textContent = row.text;
    div.appendChild(label);
    div.appendChild(text);
    descEl.appendChild(div);
  });

  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;

  logEvent("complete", selfKey+"-"+attractKey);
}

document.getElementById("retake-btn").addEventListener("click", function(){
  current = 0;
  answers = [];
  shuffledOrders = [];
  document.getElementById("result").hidden = true;
  document.getElementById("start").hidden = false;
});

document.getElementById("copy-url-btn").addEventListener("click", function(){
  var msg = document.getElementById("url-msg");
  navigator.clipboard.writeText(location.href).then(function(){
    msg.textContent = "網址已複製";
    setTimeout(function(){ msg.textContent = ""; }, 2000);
  }).catch(function(){
    msg.textContent = "複製失敗，請手動複製網址";
  });
});

})();
</script>
